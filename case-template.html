<script>
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

$('#yr').textContent = new Date().getFullYear();

/* ---- theme (same contract as index.html) ---- */
(function theme(){
  const root = document.documentElement;
  const sysDark = matchMedia('(prefers-color-scheme: dark)');
  const isDark = () => root.dataset.theme ? root.dataset.theme === 'dark' : sysDark.matches;
  const sync = () => $('#themeBtn').setAttribute('aria-label', isDark() ? 'Switch to day theme' : 'Switch to night theme');
  $('#themeBtn').addEventListener('click', () => {
    root.dataset.theme = isDark() ? 'light' : 'dark';
    try{ localStorage.setItem('gurukul-theme', root.dataset.theme); }catch(e){}
    sync();
  });
  sysDark.addEventListener('change', sync);
  sync();
})();

/* ---- scroll progress + tucked nav ---- */
const bar = $('#progress'), barTop = $('#top-bar');
const onScroll = () => {
  const max = document.documentElement.scrollHeight - innerHeight;
  bar.style.width = (max > 0 ? Math.min(1, scrollY / max) * 100 : 0) + '%';
  barTop.classList.toggle('tuck', scrollY > 40);
};
addEventListener('scroll', onScroll, { passive:true });
onScroll();

/* ---- mobile menu ---- */
(function menu(){
  const btn = $('#menuBtn'), panel = $('#menu');
  const set = open => {
    btn.setAttribute('aria-expanded', String(open));
    btn.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
    panel.classList.toggle('open', open);
  };
  btn.addEventListener('click', () => set(btn.getAttribute('aria-expanded') !== 'true'));
  addEventListener('keydown', e => { if (e.key === 'Escape') set(false); });
})();
</script>
