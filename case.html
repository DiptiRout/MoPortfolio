<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Case study — Diptiranjan Rout</title>
<link rel="stylesheet" href="site.css">
<!-- Case studies used to live at case.html?p=<slug> and are now static
     pages at case-<slug>.html. Any link already shared in an email or a
     job application still has to work, so this forwards rather than 404s.
     Without JS it degrades to a visible link, never a dead end. -->
<script>
  (function(){
    var slug = new URLSearchParams(location.search).get('p');
    if (slug && /^[a-z0-9-]+$/.test(slug)) location.replace('case-' + slug + '.html');
  })();
</script>
</head>
<body>
<div class="shell" style="padding:18vh 0">
  <p class="lede">This case study has moved.</p>
  <p><a class="btn" id="go" href="index.html#work">All work →</a></p>
</div>
<script>
  var s = new URLSearchParams(location.search).get('p');
  if (s && /^[a-z0-9-]+$/.test(s)) {
    var a = document.getElementById('go');
    a.href = 'case-' + s + '.html';
    a.textContent = 'Continue to the case study →';
  }
</script>
</body>
</html>
